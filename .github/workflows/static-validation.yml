name: GAIT static validation

on:
  push:
    branches:
      - dev/gait-foundation-1.8.0
  pull_request:
  workflow_dispatch:

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check generated locomotion graph
        run: python tools/generate_foundation_actions.py --check

      - name: Settings audit
        run: python tests/settings_audit.py

      - name: Pace calibration integration
        run: python tests/pace_calibration_integration.py

      - name: Animation graph audit
        run: python tests/foundation_graph.py

      - name: Heartbeat configuration audit
        run: python tests/heartbeat_audio.py

      - name: PBO prefix source audit
        run: python tests/pbo_prefix_layout.py

      - name: Alpha19 invariant audit
        run: python tests/alpha19_invariants.py

      - name: Compile Python validation sources
        run: python -m py_compile tools/generate_foundation_actions.py tests/settings_audit.py tests/pace_calibration_integration.py tests/foundation_graph.py tests/heartbeat_audio.py tests/pbo_prefix_layout.py tests/alpha19_invariants.py


  hemtt-build:
    needs: source-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up HEMTT
        uses: arma-actions/hemtt@v1
        with:
          version: '1.22.0'

      - name: Build GAIT
        run: hemtt build

      - name: Verify built PBOs against source
        shell: pwsh
        run: |
          ./tools/verify_build.ps1 -BuildPath ./.hemttout/build -SourceRoot .


  sqfvm-regressions:
    needs: source-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned SQF-VM
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/sqfvm.zip \
            https://github.com/SQFvm/runtime/releases/download/v2026.04.03-ed9f5f5/sqfvm_linux_x64_gcc.zip
          echo "bb4e3bb415305d2ef2c4cdb75e98f442baea3a4575887c6570a11435a780615b  /tmp/sqfvm.zip" | sha256sum -c -
          mkdir -p /tmp/sqfvm
          unzip -q /tmp/sqfvm.zip -d /tmp/sqfvm
          SQFVM="$(find /tmp/sqfvm -type f -name 'sqfvm' | head -n 1)"
          if [ -z "$SQFVM" ]; then
            echo "Could not locate sqfvm executable in pinned release archive." >&2
            find /tmp/sqfvm -maxdepth 3 -type f -print >&2
            exit 1
          fi
          chmod +x "$SQFVM"
          echo "SQFVM=$SQFVM" >> "$GITHUB_ENV"
          "$SQFVM" --version

      - name: Run 22 SQF regression suites
        run: python tools/run_regressions.py --sqfvm "$SQFVM" --output tests/validation-ci

      - name: Upload SQF regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gait-sqfvm-regression-evidence
          path: tests/validation-ci
          if-no-files-found: warn
